[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsn-sim"
version = "0.1.0"
description = "Initial software architecture for a reproducible wireless sensor network simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx",
    "simpy",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
wsn-demo = "wsn_sim.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wsn_sim*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
