[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsn-sim"
version = "0.1.0"
description = "Reproducible MHR, EMHR and S-EMHR wireless sensor network simulation."
requires-python = ">=3.10"
dependencies = [
    "networkx",
    "simpy",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
wsn-demo = "wsn_sim.demo:main"
wsn-sim = "wsn_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wsn_sim*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "test_env.py"]
pythonpath = ["src"]
